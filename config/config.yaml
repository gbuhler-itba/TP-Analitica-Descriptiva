# =============================================================================
# Configuración central del pipeline
# TP 1 - Analítica Descriptiva (ITBA, 2026 C2)
# =============================================================================
# Todas las rutas son RELATIVAS A LA RAÍZ DEL REPOSITORIO. No hay rutas
# absolutas en ningún lado del proyecto: los scripts resuelven la raíz a
# partir de su propia ubicación, así que se los puede invocar desde
# cualquier directorio de trabajo.
#
# Cualquier valor de este archivo puede pisarse por línea de comandos.
# Ver `python3 run_pipeline.py --help` y el --help de cada script en src/.
# =============================================================================

rutas:
  # Salida cruda del scraper: un TSV por cuota de barrios.
  cuotas_dir: data/raw/cuotas
  # Etapa 2: las cuotas unificadas y deduplicadas.
  consolidado: data/interim/mercadolibre_CABA_completo.tsv
  # Etapa 3: el consolidado más lat/lon/geo_status.
  geocodificado: data/interim/propiedades_geocodificadas.tsv
  # Etapa 4: dataset final, con distancias y sub-zonas.
  enriquecido: data/processed/propiedades_enriquecidas.tsv
  # Cache local del GeoJSON de estaciones de subte de BA Data.
  subte_geojson: data/external/estaciones-de-subte.geojson
  # Logs y reportes de control de calidad.
  logs_dir: outputs/logs
  # Etapa 5 (limpieza): dataset de trabajo y registro de lo eliminado.
  limpio: data/processed/propiedades_limpias.tsv
  registro_limpieza: data/processed/registro_limpieza.csv
  # Etapa 6 (análisis): salidas oficiales.
  precio_esperado: data/processed/precio_esperado.tsv
  unidades_marcadas: data/processed/unidades_marcadas.csv
  ranking: data/processed/avisos_a_investigar.csv
  embudo: data/processed/embudo_ranking.csv
  accesibilidad: data/processed/accesibilidad.tsv
  # Permisos de obra (src/permisos_obra.py, PreEntrega 3).
  permisos_obra_snapshot: data/external/obras-registradas.csv
  permisos_obra: data/processed/permisos_obra.tsv

# -----------------------------------------------------------------------------
# ETAPA 1 - Scraping
# -----------------------------------------------------------------------------
# ATENCIÓN: una corrida completa de las 5 cuotas con con_detalle=true son
# entre 8 y 15 horas. Por eso las cuotas ya descargadas vienen versionadas
# en data/raw/cuotas/ y el pipeline arranca por defecto en la etapa 2.
scraping:
  max_paginas_por_barrio: 42     # tope de la plataforma, ~2.000 avisos por barrio
  avisos_por_pagina: 48          # define el offset de paginación de MercadoLibre
  con_detalle: true              # entrar a cada ficha para extraer amenities
  timeout: 15                    # segundos por request
  guardar_cada: 100              # cada cuántos avisos se escribe el parcial
  delay_pagina: [1.5, 3.0]       # pausa aleatoria entre páginas de listado
  delay_detalle: [1.0, 2.0]      # pausa aleatoria entre fichas de detalle
  delay_barrio: [2.0, 4.0]       # pausa aleatoria al cambiar de barrio
  espera_reintento: 8            # pausa antes de reintentar una página con error

  # Los 47 barrios de CABA repartidos en 5 cuotas sin solapamiento.
  # Se dividen así para poder cortar el scraping en sesiones de 2-3 horas.
  cuotas:
    cuota1:                      # barrios de mayor oferta
      - palermo
      - belgrano
      - caballito
      - recoleta
      - villa-urquiza
      - almagro
      - nunez
      - flores
    cuota2:
      - villa-crespo
      - barrio-norte
      - puerto-madero
      - san-telmo
      - colegiales
      - villa-devoto
      - balvanera
      - villa-del-parque
      - saavedra
      - boedo
    cuota3:
      - monserrat
      - constitucion
      - san-nicolas
      - retiro
      - chacarita
      - parque-patricios
      - villa-pueyrredon
      - coghlan
      - floresta
      - villa-luro
    cuota4:
      - mataderos
      - liniers
      - villa-general-mitre
      - parque-chacabuco
      - villa-ortuzar
      - agronomia
      - paternal
      - villa-santa-rita
      - monte-castro
      - velez-sarsfield
    cuota5:                      # barrios chicos, la cuota más rápida
      - versalles
      - villa-real
      - villa-riachuelo
      - villa-soldati
      - villa-lugano
      - nueva-pompeya
      - barracas
      - la-boca
      - parque-avellaneda

# -----------------------------------------------------------------------------
# ETAPA 2 - Consolidación
# -----------------------------------------------------------------------------
consolidacion:
  patron_cuotas: "cuota*.tsv"    # se excluyen siempre los archivos "*parcial*"
  clave_duplicados: link

# -----------------------------------------------------------------------------
# ETAPA 3 - Geocodificación (normalizador de direcciones de USIG, GCBA)
# -----------------------------------------------------------------------------
geocoding:
  url_usig: "http://servicios.usig.buenosaires.gob.ar/normalizar/"
  max_reintentos: 3
  timeout: 10
  guardar_cada: 500              # cada cuántas filas se escribe el parcial
  reportar_cada: 100             # cada cuántas filas se imprime el progreso
  delay: [0.15, 0.35]            # pausa entre llamadas (es un servicio público gratuito)
  espera_http: 3                 # pausa tras una respuesta no 200
  espera_conexion: 5             # pausa tras un error de conexión

# -----------------------------------------------------------------------------
# ETAPA 4 - Enriquecimiento
# -----------------------------------------------------------------------------
enriquecimiento:
  url_subte: "https://cdn.buenosaires.gob.ar/datosabiertos/datasets/sbase/subte-estaciones/estaciones-de-subte.geojson"
  timeout: 30
  # Polos de centralidad de CABA (lat, lon). La distancia a centralidad es la
  # mínima a cualquiera de los tres.
  centralidades:
    obelisco: [-34.6037, -58.3816]
    puerto_madero: [-34.6083, -58.3625]
    catalinas: [-34.5950, -58.3720]
  subzonas_por_barrio: 5         # tope de clusters por barrio
  min_propiedades_subzona: 30    # mínimo de propiedades para abrir un cluster
  kmeans:
    random_state: 42
    n_init: 10

# -----------------------------------------------------------------------------
# ETAPA 5 - Limpieza (la misma lógica que explica el notebook 01)
# -----------------------------------------------------------------------------
limpieza:
  anio_referencia: 2026            # para convertir "año de construcción" en edad
  precio_minimo_usd: 20000         # por debajo: alquiler o error de carga
  precio_m2_maximo_usd: 50000      # por encima: error de carga (el máximo real ronda 20.000)
  m2_minimo: 15
  m2_maximo: 1000
  antiguedad_maxima: 150
  expensas_maximo_ars: 10000000
  expensas_minimo_ars: 1000        # por debajo: valor de relleno (casi todas son 1 peso)
  iqr_k: 1.5
  tipo_cambio_ars_usd: 1518.05     # dólar MEP, cierre del 14/08/2026 (Ámbito)
  # "cantidad_de_pisos" mezcla las plantas del departamento (1, o 2 en un dúplex)
  # con los pisos del edificio: la incoherencia de piso solo se mide desde este valor.
  pisos_edificio_desde: 3

# -----------------------------------------------------------------------------
# ETAPA 6 - Análisis: precio esperado, brecha y ranking (PreEntrega 3)
# -----------------------------------------------------------------------------
analisis:
  k_folds: 5                     # partes de la validación cruzada (agrupadas por unidad)
  semilla: 42
  minimo_grupo: 10               # avisos mínimos para usar una zona como referencia
  iqr_k: 1.5                     # atípicos: IQR sobre el log del precio por m², dentro de la zona
  umbral: -0.25                  # brecha desde la que un aviso queda marcado
  minimo_avisos_barrio: 50       # barrios más chicos usan el error de la ciudad en el umbral por barrio
  # Decisiones del notebook 04 (PreEntrega 3)
  modelo_oficial: lineal_ampliado   # lineal_ampliado o gbm; el otro se usa para la marca de consenso
  nivel_intervalo: 0.80             # intervalo de predicción por aviso (conformal cruzado, por barrio)
  ari_minimo_subzona: 0.7           # debajo: sub-zonas inestables, el barrio se compara entero
  repeticiones_estabilidad: 100

# -----------------------------------------------------------------------------
# Controles de calidad
# -----------------------------------------------------------------------------
qc:
  columnas_clave:
    - link
    - precio
    - m2
    - ubicacion
    - barrio


# -----------------------------------------------------------------------------
# FUENTES EXTERNAS (PreEntrega 3): accesibilidad, espacios verdes y barrios
# -----------------------------------------------------------------------------
# src/fuentes_externas.py lee el dataset enriquecido y escribe un TSV aparte,
# con link como clave. No modifica ningún dataset existente. Todas las fuentes
# son snapshots de BA Data descargados el 27/10/2026 (el de premetro, el 28/10/2026): las fichas, con link y
# SHA-256, están en docs/entregas_grupo/fuentes_externas.md.
fuentes_externas:
  rutas:
    salida: data/processed/accesibilidad.tsv
    tren: data/external/estaciones-ferrocarril.geojson
    metrobus: data/external/estaciones-metrobus.geojson
    premetro: data/external/estaciones-premetro.geojson
    espacios_verdes: data/external/espacios-verdes-publicos.geojson
    barrios: data/external/barrios.geojson
    barrios_populares: data/external/barrios-populares.geojson

  # Proyección métrica para los polígonos: UTM 21S. En CABA la distorsión de
  # escala es del orden de 0,02%. Las distancias a puntos usan haversine, como
  # el subte, para que el mínimo compare distancias medidas igual.
  crs_metrico: "EPSG:32721"

  # El dataset de tren cubre toda la red metropolitana y no trae un campo de
  # estado. Se excluyen las estaciones cerradas por nombre.
  tren:
    campo_nombre: nombre
    excluir_nombre_regex: "^Ex-estaci"

  verdes:
    campo_clase: clasificac
    # dist_espacio_verde_m: solo espacios que funcionan como plaza o parque.
    # Quedan afuera canteros centrales, plazoletas (el 57% mide menos de
    # 500 m²), patios y paseos. PARQUE SEMIPÚBLICO incluye la Reserva Ecológica.
    clases_distancia:
      - PLAZA
      - PARQUE
      - PARQUE SEMIPÚBLICO
      - JARDÍN
      - JARDÍN BOTÁNICO
    # area_verde_500m_ha: todo salvo los canteros centrales y la franja de la
    # General Paz (id 652, una "plazoleta" de 104 ha que es el borde de la
    # avenida). Se mide el área dentro del círculo, no la del polígono entero.
    clases_excluidas_area:
      - CANTERO CENTRAL
    ids_excluidos_area: [652]
    radio_area_m: 500
    segmentos_cuarto: 32           # 128 vértices: el círculo pierde 0,04% de área

  # Si un punto cae en dos barrios populares superpuestos (Rodrigo Bueno y
  # Playón de Chacarita tienen dos polígonos cada uno), se informa el tipo más
  # informal. El modelo probablemente use solo villas y asentamientos.
  barrios_populares:
    prioridad_tipo:
      - Villa
      - Asentamiento precario
      - Núcleo habitacional transitorio
      - Barrio urbanizado
      - Barrio municipal
      - Conjunto habitacional

  # barrio_coincide compara el barrio de búsqueda de MercadoLibre con el
  # oficial, normalizados (mayúsculas, sin tildes, guiones ni puntos).
  # Barrio Norte no es un barrio oficial: se toma como coincidente si cae en
  # Recoleta, Retiro o Palermo. "Gral." se expande para que Villa Gral. Mitre
  # coincida con la búsqueda villa-general-mitre.
  equivalencias_barrio:
    barrio-norte: [Recoleta, Retiro, Palermo]
  # Punto a más de esta distancia del barrio buscado: geocodificación dudosa (geo_dudoso).
  umbral_geo_dudoso_m: 1000
  abreviaturas_barrio:
    GRAL: GENERAL

# -----------------------------------------------------------------------------
# PERMISOS DE OBRA (PreEntrega 3): src/permisos_obra.py
# -----------------------------------------------------------------------------
permisos_obra:
  fecha_scraping: "2026-08-14"     # fin de la ventana (no incluido)
  anios_ventana: 3                 # 14/08/2023 a 13/08/2026 (ficha 9)
  radio_m: 500
  tipos_obra:
    - PERMISO DE EJECUCION DE OBRA CIVIL
    - PERMISO TEMPRANO DE EJECUCION DE OBRA CIVIL
    - REGISTRO-PERMISO OBRA
    - DEMOLICION TOTAL Y OBRA
    - OBRA NUEVA
    - PERMISO DE OBRA MAYOR
